name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show project files
        run: |
          echo "== settings.gradle =="
          cat settings.gradle || echo "settings.gradle NOT FOUND"
          echo "== app folder =="
          ls -la app || echo "app folder NOT FOUND"
          echo "== all files =="
          find . -type f -not -path "./.git/*" | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Validate Android project layout  
        run: test -f settings.gradle
             test -d app
             test -f app/build.gradle
             echo "Android project layout OK"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: List Gradle projects
        run: gradle projects --console=plain

      - name: Build debug APK
        run: gradle :app:assembleDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OriginOSWiggle-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
